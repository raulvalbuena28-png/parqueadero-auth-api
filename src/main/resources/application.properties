# ===== Configuración del servicio =====
spring.application.name=parqueadero-auth-api
server.port=8080

# ===== Base de datos MySQL (cambiar usuario y contraseña por los suyos) =====
spring.datasource.url=jdbc:mysql://localhost:3306/parqueadero?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=America/Bogota
spring.datasource.username=root
spring.datasource.password=

# Hibernate crea/actualiza la tabla "usuarios" automáticamente
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
